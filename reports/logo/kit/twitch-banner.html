<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Exa:wght@500;600&family=Lexend:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1200px;height:480px;overflow:hidden;background:#0B0F15}
.bg{position:absolute;inset:0;background:url(booth.jpg) 50% 40%/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg, rgba(11,15,21,.55) 0%, rgba(11,15,21,.78) 45%, rgba(11,15,21,.70) 75%, rgba(11,15,21,.92) 100%)}
.glow{position:absolute;left:880px;top:90px;width:360px;height:300px;background:radial-gradient(ellipse at 50% 50%, rgba(240,177,60,.22) 0%, rgba(240,177,60,0) 65%)}
.col{position:absolute;left:955px;width:195px;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.col svg{width:120px;height:80px}
.w1{font-family:'Lexend Exa';font-weight:500;font-size:23px;letter-spacing:3px;padding-left:3px;color:#F1ECE3;line-height:1;white-space:nowrap}
.w2{font-family:'Lexend Exa';font-weight:500;font-size:12px;letter-spacing:6px;padding-left:6px;color:#A9B2BE;line-height:1;margin-top:-6px}
.rule{width:44px;height:2px;background:#F0B13C;margin:4px 0}
.tag{font-family:'Lexend';font-size:11px;letter-spacing:3px;color:#F0B13C;text-align:center;line-height:1.7}
.edge{position:absolute;left:28px;top:120px;bottom:120px;width:2px;background:linear-gradient(#F0B13C00,#F0B13C,#F0B13C00);opacity:.7}
.marks{position:absolute;left:0;right:0;top:0;height:480px;opacity:.06}
</style></head><body>
<div class="bg"></div><div class="shade"></div><div class="glow"></div>
<div class="edge"></div>
<div class="col">
<svg viewBox="-375 -50 750 500"><path d="M300,400 L40,400 L300,0 L110,0 L0,290 L-110,0 L-300,0 L-40,400 L-300,400" fill="none" stroke="#F0B13C" stroke-width="68" stroke-linejoin="miter" stroke-miterlimit="12"/></svg>
<div class="w1">SPENCER Z</div><div class="w2">VOICEOVERS</div>
<div class="rule"></div>
<div class="tag">COMMERCIAL<br>NARRATION<br>E-LEARNING</div>
</div>
</body></html>
